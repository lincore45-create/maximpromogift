#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
#stage>h1,#stage>p,.hud{text-shadow:0 1px 8px rgba(255,255,255,.85)}
h1{font-size:26px;margin:0;line-height:1.15}p{margin:0;font-size:16px}
.card{background:rgba(255,255,255,.92);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(360px,100%)}
.btn{background:var(--r);color:#fff;border:0;border-radius:16px;padding:14px 28px;font-size:18px;font-weight:800;box-shadow:0 5px 0 #a00009;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a00009}
.btn.k{background:var(--k);box-shadow:0 5px 0 #000}
#stage{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
/* wheel */
.wwrap{position:relative;width:260px;height:260px}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--k);background:repeating-conic-gradient(var(--r) 0 22.5deg,var(--y) 22.5deg 45deg);transition:transform 4s cubic-bezier(.15,.7,.1,1)}
.pin{position:absolute;top:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:28px solid var(--k);border-bottom:0}
.hub{position:absolute;inset:50% auto auto 50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--k);color:var(--r);font-weight:900;font-size:30px;display:grid;place-items:center}
/* gifts */
.gifts{display:flex;gap:10px}.gift{font-size:68px;background:none;border:0;cursor:pointer;transition:.4s}
.gift:active{transform:scale(.9)}.gift.open{transform:scale(1.4) rotate(12deg)}.gift.gone{opacity:.15;transform:scale(.7)}
/* scratch */
.sc{position:relative;width:280px;height:150px;border-radius:18px;overflow:hidden;background:#fff;display:grid;place-items:center;font-size:60px}
.sc canvas{position:absolute;inset:0;touch-action:none}
/* coins */
.arena{position:relative;width:min(320px,100%);height:380px;background:rgba(255,255,255,.55);border-radius:24px;overflow:hidden;touch-action:manipulation}
.coin{position:absolute;top:-60px;font-size:46px;border:0;background:none;animation:fall 2.4s linear forwards;cursor:pointer}
@keyframes fall{to{top:400px}}
.hud{font-weight:800;font-size:20px}
/* slot */
.reels{display:flex;gap:8px;background:var(--k);padding:12px;border-radius:20px}
.reel{width:76px;height:96px;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:50px}
/* reveal */
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
#ov.on{display:flex}#ov .card{animation:pop .5s}@keyframes pop{from{transform:scale(.5);opacity:0}}
.big{font-size:84px}.pz{font-size:28px;font-weight:900;color:var(--r);margin:6px 0 14px}
.cf{position:fixed;top:-20px;width:10px;height:16px;animation:cf linear forwards;z-index:9}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.lang{display:flex;gap:6px;background:rgba(255,255,255,.9);padding:4px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.lang button{border:0;background:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:700;color:var(--k);cursor:pointer}
.lang button.on{background:var(--r);color:#fff}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(280px,100%)}
.pad{height:120px;border:4px solid var(--k);border-radius:22px;font-size:54px;cursor:pointer;transition:.12s;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.pad.lit{transform:scale(1.08);box-shadow:0 0 0 6px #fff,0 0 30px 12px rgba(255,255,255,.95);filter:brightness(1.25)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:min(320px,100%);background:rgba(255,255,255,.7);padding:8px;border-radius:20px;touch-action:manipulation}
.cell{aspect-ratio:1;border:0;border-radius:12px;background:#fff;font-size:30px;line-height:1;padding:0;cursor:pointer}
.cell.sel{box-shadow:0 0 0 4px var(--r);transform:scale(1.08)}
.cell.pop{animation:pp .28s forwards}@keyframes pp{to{transform:scale(0);opacity:0}}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:20;cursor:pointer}
</style></head><body>

 none:"All prizes have been claimed. Thank you for playing!",err:"Connection problem. Please try again.",retry:"Try again",bonus:"Win on your first try for 2 prizes!",won2:"Perfect! You won 2 prizes!",catcher:"Catch coins, dodge bombs!",catcherHint:"Tap coins 🪙, avoid bombs 💣, don't let coins drop",memory:"Remember the pattern!",watch:"Watch carefully…",turn:"Your turn!",round:"Round",m3:"Match 3!",m3h:"Swap neighbours to line up 3 or more",inv:"Defend the sky!",invh:"Drag to move, auto-fire, clear all invaders",fl:"Fly through the pipes!",flh:"Tap to flap, don't hit the pipes",oops:"Oops! Try again",lost:"No prize yet. Give it another go!"}};
let L="th";try{const l=localStorage.getItem("mx_lang");if(TT[l])L=l}catch(e){}
const T=new Proxy({},{get:(_,k)=>TT[L][k]});
const pn=p=>L==="th"?(p.th||p.en):p.en;
const PRIZES=[["Apron",2],["Jacket for driver",2],["Vest for drivers",2],["Longsleeve for drivers",5],["Helmets",1],["Raincoats",1],["Maxim cap",50],["Maxim Snack",250],["1000 THB discount voucher",3],["Tote bag",20],["Post card",20],["Sticker set",200],["Magnet",200],["Keychain",100],["Pin",100]];
const $=s=>document.querySelector(s),st=$("#stage");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
// ---- DEMO stock (stand-in for the Google Sheet; replace claimPrize() with a call to Apps Script)
let stock;try{stock=JSON.parse(localStorage.getItem("mx_stock"))}catch(e){}
if(!stock||location.search.includes("reset"))stock=Object.fromEntries(PRIZES);
async function claim(game,n){ // reserves up to n prizes (stock is reduced immediately)
  if(API_URL){
    const r=await fetch(API_URL+"?action=claim&game="+encodeURIComponent(game)+"&lang="+L+"&n="+n);
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    if(d.ok)return{rid:d.rid,prizes:(d.prizes||[{prize:d.prize,prizeTh:d.prizeTh}]).map(q=>({en:q.prize,th:q.prizeTh||q.prize}))};
    if(d.reason==="empty")return null;
    throw new Error(d.reason||"error");
  }
  const got=[];
  for(let k=0;k<n;k++){
    let ks=Object.keys(stock).filter(q=>stock[q]>0&&!got.some(g=>g.en===q));
    if(!ks.length)ks=Object.keys(stock).filter(q=>stock[q]>0);
    if(!ks.length)break;
    let r=Math.random()*ks.reduce((a,q)=>a+stock[q],0),pick=ks[ks.length-1];
    for(const q of ks){r-=stock[q];if(r<0){pick=q;break}}
    stock[pick]--;got.push({en:pick,th:pick});
  }
  try{localStorage.setItem("mx_stock",JSON.stringify(stock))}catch(e){}
  return got.length?{prizes:got}:null;
}
function release(r,keep){ // gives back the reserved prizes that were not won
  if(!r||r.prizes.length<=keep)return;
  if(!API_URL){r.prizes.slice(keep).forEach(q=>stock[q.en]++);try{localStorage.setItem("mx_stock",JSON.stringify(stock))}catch(e){}return}
  fetch(API_URL+"?action=release&rid="+encodeURIComponent(r.rid||"")+"&keep="+keep+"&game="+encodeURIComponent(cur)+"&lang="+L,{keepalive:true}).catch(()=>{});
}
// ---- screens
function home(){
  document.documentElement.lang=L;
  st.innerHTML=`<div class="lang">${["th","en"].map(l=>`<button data-l="${l}" class="${l===L?"on":""}">${l==="th"?"ไทย":"English"}</button>`).join("")}</div>
  <div class="card"><div class="big">🎉</div><h1>${T.title}</h1><p style="margin:8px 0">${T.sub}</p><p style="margin:0 0 16px;font-weight:800;color:var(--r)">${T.bonus}</p><button class="btn" id="go">${T.play}</button></div>`;
  $("#go").onclick=start;
  st.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("mx_lang",L)}catch(e){}home()});
}
const GAMES={match3,invaders,flappy};
let losses=0,cur,pp,run=0,halt=0;
const noneCard=()=>`<div class="card"><div class="big">🙏</div><p>${T.none}</p></div>`;
function start(){
  music();losses=0;halt=0;const id=++run;
  const q=new URLSearchParams(location.search).get("game");
  cur=GAMES[q]?q:rnd(Object.keys(GAMES));
  const c=claim(cur,2);pp=c;c.catch(()=>{}); // prizes are reserved in the background while the player is playing
  c.then(r=>{c.done=1;if(!r&&id===run){halt=1;st.innerHTML=noneCard()}},()=>{c.done=1});
  attempt();
}
function attempt(){const id=run;st.innerHTML="";GAMES[cur](won=>{if(id===run)end(won)})}
function end(won){
  if(halt)return;
  if(won)return win(losses?1:2);
  losses++;
  if(losses>=3){
    pp.then(r=>release(r,0),()=>{});
    st.innerHTML=`<div class="card"><div class="big">💪</div><p>${T.lost}</p><p style="margin-top:14px"><button class="btn" id="rt">${T.retry}</button></p></div>`;
    $("#rt").onclick=start;return}
  st.innerHTML=`<div class="card"><div class="big">💥</div><p>${T.oops}</p>${hud()}</div>`;
  setTimeout(()=>{if(!halt)attempt()},1200);
}
async function win(keep){
  const c=pp;
  if(!c.done){$("#res").innerHTML='<div class="big">✨</div>';$("#ov").classList.add("on")}
  try{
    const r=await c;
    if(!r){$("#ov").classList.remove("on");st.innerHTML=noneCard();return}
    reveal(r.prizes.slice(0,keep));release(r,keep);
  }catch(e){
    $("#ov").classList.remove("on");
    st.innerHTML=`<div class="card"><div class="big">📶</div><p>${T.err}</p>${location.search.includes("debug")?`<p style="font-size:12px;opacity:.6;margin-top:6px;word-break:break-all">${e&&e.message}</p>`:""}<p style="margin-top:14px"><button class="btn" id="rt">${T.retry}</button></p></div>`;
    $("#rt").onclick=()=>{pp=claim(cur,keep);pp.catch(()=>{});win(keep)};
  }
}
function reveal(ps){
  $("#res").innerHTML=`<div class="big">🎉</div><p>${ps.length>1?T.won2:T.won}</p>${ps.map(p=>`<div class="pz" style="margin:6px 0">${pn(p)}</div>`).join("")}<div style="height:10px"></div>
  <a class="btn" href="${DOWNLOAD_URL}" target="_blank" rel="noopener">${T.dl}</a>`;
  $("#ov").classList.add("on");
  for(let i=0;i<50;i++){const c=document.createElement("div");c.className="cf";
    c.style.cssText=`left:${Math.random()*100}vw;background:${rnd(["#e30613","#ffd400","#1c1c1c","#fff"])};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}
}
const title=t=>`<h1>${t}</h1>`;
// ---- games
const hud=()=>`<div class="hud">${"❤️".repeat(3-losses)}${"🤍".repeat(losses)}</div>`;
function cvs(t,h){st.innerHTML=title(t)+`<p>${h}</p>`+hud()+'<canvas id="cv" width="300" height="420" style="width:min(300px,100%);height:auto;aspect-ratio:300/420;border-radius:24px;touch-action:none;box-shadow:0 10px 30px rgba(0,0,0,.25)"></canvas>';return $("#cv")}
function loop(cv,fn){let l=performance.now();(function f(n){if(!cv.isConnected)return;const dt=Math.min((n-l)/1000,.05);l=n;if(fn(dt)!==false)requestAnimationFrame(f)})(l)}
function steer(cv,set){let d=0;const at=e=>{const r=cv.getBoundingClientRect();set((e.clientX-r.left)*300/r.width)};cv.onpointerdown=e=>{d=1;cv.setPointerCapture(e.pointerId);at(e)};cv.onpointermove=e=>d&&at(e);cv.onpointerup=()=>d=0}

// 1) Match-3: reach the target in a limited number of moves
function match3(end){
  const N=6,E=["🪙","⭐","🚕","🎈","🍀"],TG=58,sleep=ms=>new Promise(r=>setTimeout(r,ms)),R=()=>Math.floor(Math.random()*5);
  let mv=16,sc=0,sel=-1,busy=0,g;
  st.innerHTML=title(T.m3)+`<p>${T.m3h}</p>`+hud()+`<div class="hud">🎯 <span id="sc">0</span>/${TG} &nbsp; 🔄 <span id="mv">${mv}</span></div><div class="grid" id="bd"></div>`;
  const sw=(a,b)=>{const t=g[(a/N)|0][a%N];g[(a/N)|0][a%N]=g[(b/N)|0][b%N];g[(b/N)|0][b%N]=t};
  function find(){const m=new Set();for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=g[r][c];
    if(c<N-2&&g[r][c+1]==v&&g[r][c+2]==v)[0,1,2].forEach(k=>m.add(r*N+c+k));
    if(r<N-2&&g[r+1][c]==v&&g[r+2][c]==v)[0,1,2].forEach(k=>m.add((r+k)*N+c))}return m}
  function has(){for(let r=0;r<N;r++)for(let c=0;c<N;c++)for(const[d,e]of[[0,1],[1,0]])if(r+d<N&&c+e<N){const a=r*N+c,b=(r+d)*N+c+e;sw(a,b);const f=find().size;sw(a,b);if(f)return 1}return 0}
  function fill(){do{g=Array.from({length:N},()=>Array(N).fill(0));
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v;do v=R();while((c>1&&g[r][c-1]==v&&g[r][c-2]==v)||(r>1&&g[r-1][c]==v&&g[r-2][c]==v));g[r][c]=v}}while(!has())}
  const draw=m=>{$("#bd").innerHTML=g.flat().map((v,i)=>`<button class="cell${i==sel?" sel":""}${m&&m.has(i)?" pop":""}" data-i="${i}">${E[v]}</button>`).join("");$("#sc").textContent=sc;$("#mv").textContent=mv};
  async function settle(){let m;while((m=find()).size){sc+=m.size;draw(m);await sleep(300);
    m.forEach(i=>g[(i/N)|0][i%N]=-1);
    for(let c=0;c<N;c++){const col=[];for(let r=N-1;r>=0;r--)if(g[r][c]>=0)col.push(g[r][c]);while(col.length<N)col.push(R());for(let r=0;r<N;r++)g[N-1-r][c]=col[r]}
    draw();await sleep(250)}}
  async function tap(i){
    if(busy)return;
    if(sel<0||Math.abs(((sel/N)|0)-((i/N)|0))+Math.abs(sel%N-i%N)!=1){sel=i;draw();return}
    busy=1;const a=sel;sel=-1;sw(a,i);draw();await sleep(220);
    if(!find().size){sw(a,i);draw();await sleep(220);busy=0;return}
    mv--;await settle();
    if(sc>=TG){await sleep(300);return end(true)}
    if(mv<=0){await sleep(300);return end(false)}
    if(!has()){fill();draw()}
    busy=0}
  $("#bd").onpointerdown=e=>{const b=e.target.closest(".cell");if(b)tap(+b.dataset.i)};
  fill();draw();
}

// 2) Space Invaders: clear all aliens; one hit = lost attempt
function invaders(end){
  const cv=cvs(T.inv,T.invh),x=cv.getContext("2d"),al=[],stars=Array.from({length:30},()=>[Math.random()*300,Math.random()*420]);
  for(let r=0;r<5;r++)for(let c=0;c<6;c++)al.push({x:46+c*38,y:42+r*28});
  let dir=1,px=150,tx=150,bl=[],eb=[],ft=0,et=0,over=0;
  steer(cv,v=>tx=v);
  document.addEventListener("keydown",e=>{if(cv.isConnected){if(e.key=="ArrowLeft")tx-=40;if(e.key=="ArrowRight")tx+=40}});
  const fin=w=>{over=1;setTimeout(()=>end(w),500)};
  loop(cv,dt=>{
    px+=(tx-px)*Math.min(1,dt*12);px=Math.max(20,Math.min(280,px));
    if(!over){
      const sp=26+(30-al.length)*2.5;let edge=0;
      for(const a of al){a.x+=dir*sp*dt;if(a.x>272||a.x<28)edge=1}
      if(edge){dir=-dir;for(const a of al){a.x+=dir*4;a.y+=8}}
      ft+=dt;if(ft>.6){ft=0;bl.push({x:px,y:355})}
      et+=dt;if(et>.7&&al.length){et=0;const a=rnd(al);eb.push({x:a.x,y:a.y+10})}
      bl.forEach(b=>b.y-=360*dt);eb.forEach(b=>b.y+=170*dt);
      for(const b of bl){const i=al.findIndex(a=>Math.abs(a.x-b.x)<18&&Math.abs(a.y-b.y)<16);if(i>=0){al.splice(i,1);b.y=-99}}
      bl=bl.filter(b=>b.y>0);eb=eb.filter(b=>b.y<430);
      if(eb.some(b=>Math.abs(b.x-px)<16&&b.y>345&&b.y<385)||al.some(a=>a.y>335))fin(false);
      else if(!al.length)fin(true);
    }
    x.fillStyle="#14213d";x.fillRect(0,0,300,420);x.fillStyle="#fff";stars.forEach(s=>x.fillRect(s[0],s[1],2,2));
    x.textAlign="center";x.textBaseline="middle";x.font="26px serif";al.forEach(a=>x.fillText("👾",a.x,a.y));
    x.font="34px serif";x.fillText("🚀",px,372);
    x.fillStyle="#ffd400";bl.forEach(b=>x.fillRect(b.x-2,b.y-8,4,12));
    x.fillStyle="#ff4d4d";eb.forEach(b=>{x.beginPath();x.arc(b.x,b.y,4,0,7);x.fill()});
    return true;
  });
}

// 3) Flappy: fly through 10 pipes; any crash = lost attempt
function flappy(end){
  const cv=cvs(T.fl,T.flh),x=cv.getContext("2d"),G=900,F=-290,SP=90,GAP=165,NP=22,W=46;
  let gy0=120;const ps=Array.from({length:NP},(_,i)=>{gy0=Math.max(50,Math.min(400-GAP-60,gy0+(Math.random()-.5)*140));return{x:300+i*180,gy:gy0}});
  let y=200,vy=0,dist=0,score=0,go=0,over=0;
  const flap=()=>{if(!over){go=1;vy=F}};
  cv.onpointerdown=flap;document.addEventListener("keydown",e=>{if(cv.isConnected&&e.key==" ")flap()});
  loop(cv,dt=>{
    if(!over){
      if(go){vy+=G*dt;y+=vy*dt;dist+=SP*dt}else y=200+Math.sin(performance.now()/200)*6;
      if(y<12){y=12;vy=0}
      let dead=y>398;
      for(const p of ps){const sx=p.x-dist;
        if(sx<80+12&&sx+W>80-12&&(y-12<p.gy||y+12>p.gy+GAP))dead=true;
        if(!p.c&&sx+W<80-12){p.c=1;score++}}
      if(dead||score>=NP){over=1;const w=!dead&&score>=NP;setTimeout(()=>end(w),500)}
    }
    x.fillStyle="#9fdcff";x.fillRect(0,0,300,420);
    for(const p of ps){const sx=p.x-dist;if(sx>-W&&sx<300){x.fillStyle="#43b649";x.fillRect(sx,0,W,p.gy);x.fillRect(sx,p.gy+GAP,W,420-p.gy-GAP);
      x.fillStyle="#2e8b3a";x.fillRect(sx-3,p.gy-14,W+6,14);x.fillRect(sx-3,p.gy+GAP,W+6,14)}}
    x.fillStyle="#e6c27a";x.fillRect(0,408,300,12);
    x.save();x.translate(80,y);x.rotate(Math.max(-.5,Math.min(1,vy/600)));x.scale(-1,1);x.font="30px serif";x.textAlign="center";x.textBaseline="middle";x.fillText("🐤",0,0);x.restore();
    x.fillStyle="#1c1c1c";x.font="bold 22px system-ui";x.textAlign="center";x.fillText("🏁 "+score+"/"+NP,150,26);
    if(!go){x.font="bold 18px system-ui";x.fillText("TAP",150,300)}
    return !over;
  });
}
// ---- background music (synthesized, no audio files)
let ac,mg,on=true;
function music(){
  if(ac){if(ac.state==="suspended"&&on)ac.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  ac=new C();mg=ac.createGain();mg.gain.value=on?.16:0;mg.connect(ac.destination);
  const S=[523.25,587.33,659.25,783.99,880],R=[130.81,98,110,87.31],
  M=[2,-1,3,2,4,3,2,-1, 1,-1,3,1,3,2,1,-1, 2,-1,4,2,4,3,2,-1, 0,-1,2,0,3,2,1,0],
  sec=60/128/2;let step=0,t0=ac.currentTime+.1;
  function nt(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
  setInterval(()=>{while(t0<ac.currentTime+.4){
    const i=step%32,bar=i>>3,t=t0;
    if(i%2==0)nt(R[bar],t,sec*1.8,"triangle",.9);
    if(i%4==2)nt(R[bar]*2,t,sec*.8,"triangle",.35);
    if(M[i]>=0)nt(S[M[i]],t,sec*1.6,"square",.12);
    if(i%2==1)nt(3000,t,.03,"square",.04);
    step++;t0+=sec}},100);
}
function mute(){on=!on;$("#mu").textContent=on?"🔊":"🔇";if(mg)mg.gain.setTargetAtTime(on?.16:0,ac.currentTime,.05)}
$("#mu").onclick=()=>{mute();if(on)music()};
document.addEventListener("visibilitychange",()=>{if(!ac)return;document.hidden?ac.suspend():(on&&ac.resume())});
home();
if(API_URL)fetch(API_URL+"?action=ping").catch(()=>{}); // wake up the script so the first claim is fast
</script></body></html>
