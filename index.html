#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center}
.logo{height:46px;width:auto;display:block}
h1{font-size:26px;margin:0;line-height:1.15}p{margin:0;font-size:16px}
.card{background:rgba(255,255,255,.92);border-radius:24px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:min(360px,100%)}
.btn{background:var(--r);color:#fff;border:0;border-radius:16px;padding:14px 28px;font-size:18px;font-weight:800;box-shadow:0 5px 0 #a00009;cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a00009}
.btn.k{background:var(--k);box-shadow:0 5px 0 #000}
#stage{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
/* wheel */
.wwrap{position:relative;width:260px;height:260px}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--k);background:repeating-conic-gradient(var(--r) 0 22.5deg,var(--y) 22.5deg 45deg);transition:transform 4s cubic-bezier(.15,.7,.1,1)}
.pin{position:absolute;top:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-top:28px solid var(--k);border-bottom:0}
.hub{position:absolute;inset:50% auto auto 50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--k);color:var(--r);font-weight:900;font-size:30px;display:grid;place-items:center}
/* gifts */
.gifts{display:flex;gap:10px}.gift{font-size:68px;background:none;border:0;cursor:pointer;transition:.4s}
.gift:active{transform:scale(.9)}.gift.open{transform:scale(1.4) rotate(12deg)}.gift.gone{opacity:.15;transform:scale(.7)}
/* scratch */
.sc{position:relative;width:280px;height:150px;border-radius:18px;overflow:hidden;background:#fff;display:grid;place-items:center;font-size:60px}
.sc canvas{position:absolute;inset:0;touch-action:none}
/* coins */
.arena{position:relative;width:min(320px,100%);height:380px;background:rgba(255,255,255,.55);border-radius:24px;overflow:hidden;touch-action:manipulation}
.coin{position:absolute;top:-60px;font-size:46px;border:0;background:none;animation:fall 2.4s linear forwards;cursor:pointer}
@keyframes fall{to{top:400px}}
.hud{font-weight:800;font-size:20px}
/* slot */
.reels{display:flex;gap:8px;background:var(--k);padding:12px;border-radius:20px}
.reel{width:76px;height:96px;background:#fff;border-radius:12px;display:grid;place-items:center;font-size:50px}
/* reveal */
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45);padding:16px}
#ov.on{display:flex}#ov .card{animation:pop .5s}@keyframes pop{from{transform:scale(.5);opacity:0}}
.big{font-size:84px}.pz{font-size:28px;font-weight:900;color:var(--r);margin:6px 0 14px}
.cf{position:fixed;top:-20px;width:10px;height:16px;animation:cf linear forwards;z-index:9}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
.lang{display:flex;gap:6px;background:rgba(255,255,255,.9);padding:4px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.lang button{border:0;background:none;border-radius:999px;padding:8px 18px;font-size:15px;font-weight:700;color:var(--k);cursor:pointer}
.lang button.on{background:var(--r);color:#fff}
#mu{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:20;cursor:pointer}

let stock;try{stock=JSON.parse(localStorage.getItem("mx_stock"))}catch(e){}
if(!stock||location.search.includes("reset"))stock=Object.fromEntries(PRIZES);
async function claim(game){
  if(API_URL){
    const r=await fetch(API_URL+"?action=claim&game="+encodeURIComponent(game)+"&lang="+L);
    const d=await r.json();
    if(d.ok)return{en:d.prize,th:d.prizeTh||PTH[d.prize]||d.prize};
    if(d.reason==="empty")return null;
    throw new Error(d.reason||"error");
  }
  const tot=Object.values(stock).reduce((a,b)=>a+b,0);if(!tot)return null;
  let r=Math.random()*tot,pick=null;
  for(const k in stock){if(stock[k]<=0)continue;r-=stock[k];if(r<0){pick=k;break}}
  pick=pick||Object.keys(stock).find(k=>stock[k]>0);stock[pick]--;
  try{localStorage.setItem("mx_stock",JSON.stringify(stock))}catch(e){}
  await new Promise(r=>setTimeout(r,250));return{en:pick,th:PTH[pick]||pick};
}
// ---- screens
function home(){
  document.documentElement.lang=L;
  st.innerHTML=`<div class="lang">${["th","en"].map(l=>`<button data-l="${l}" class="${l===L?"on":""}">${l==="th"?"ไทย":"English"}</button>`).join("")}</div>
  <div class="card"><div class="big">🎁</div><h1>${T.title}</h1><p style="margin:8px 0 16px">${T.sub}</p><button class="btn" id="go">${T.play}</button></div>`;
  $("#go").onclick=start;
  st.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem("mx_lang",L)}catch(e){}home()});
}
const GAMES={wheel,gift,scratch,coins,slot,drive};
async function start(){
  music();
  const q=new URLSearchParams(location.search).get("game");
  const key=GAMES[q]?q:rnd(Object.keys(GAMES));
  st.innerHTML='<div class="card"><div class="big">🎁</div></div>';
  let prize;
  try{prize=await claim(key)}catch(e){
    st.innerHTML=`<div class="card"><div class="big">📶</div><p>${T.err}</p><p style="margin-top:14px"><button class="btn" id="rt">${T.retry}</button></p></div>`;
    $("#rt").onclick=start;return}
  if(!prize){st.innerHTML=`<div class="card"><div class="big">🙏</div><p>${T.none}</p></div>`;return}
  st.innerHTML="";GAMES[key](prize,()=>reveal(prize));
}
function reveal(p){
  $("#res").innerHTML=`<div class="big">${emo(p.en)}</div><p>${T.won}</p><div class="pz">${pn(p)}</div>
  <a class="btn" href="${DOWNLOAD_URL}" target="_blank" rel="noopener">${T.dl}</a>`;
  $("#ov").classList.add("on");
  for(let i=0;i<50;i++){const c=document.createElement("div");c.className="cf";
    c.style.cssText=`left:${Math.random()*100}vw;background:${rnd(["#e30613","#ffd400","#1c1c1c","#fff"])};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s`;
    document.body.appendChild(c);setTimeout(()=>c.remove(),5000)}
}
const title=t=>`<h1>${t}</h1>`;
// ---- games
function wheel(p,done){
  st.innerHTML=title(T.wheel)+`<div class="wwrap"><div class="pin"></div><div class="wheel" id="w"></div><div class="hub">a</div></div><button class="btn" id="b">${T.spin}</button>`;
  $("#b").onclick=function(){this.disabled=true;$("#w").style.transform=`rotate(${360*6+Math.random()*360}deg)`;setTimeout(done,4300)};
}
function gift(p,done){
  st.innerHTML=title(T.pick)+`<div class="gifts">${["🎁","🎁","🎁"].map(g=>`<button class="gift">${g}</button>`).join("")}</div>`;
  const bs=[...st.querySelectorAll(".gift")];
  bs.forEach(b=>b.onclick=()=>{bs.forEach(x=>{x.onclick=null;x.classList.add(x===b?"open":"gone")});setTimeout(done,900)});
}
function scratch(p,done){
  st.innerHTML=title(T.scratch)+`<div class="sc">${emo(p.en)}<canvas width="280" height="150"></canvas></div>`;
  const c=st.querySelector("canvas"),x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,280,150);g.addColorStop(0,"#bdbdbd");g.addColorStop(.5,"#eee");g.addColorStop(1,"#a8a8a8");
  x.fillStyle=g;x.fillRect(0,0,280,150);x.fillStyle="#777";x.font="900 26px system-ui";x.textAlign="center";x.fillText(T.scratchHere,140,84);
  let down=false,n=0,fin=false;
  const at=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*280/r.width,(e.clientY-r.top)*150/r.height]};
  c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);sc(e)};c.onpointerup=()=>down=false;c.onpointermove=e=>down&&sc(e);
  function sc(e){const[a,b]=at(e);x.globalCompositeOperation="destination-out";x.beginPath();x.arc(a,b,20,0,7);x.fill();
    if(++n%8||fin)return;const d=x.getImageData(0,0,280,150).data;let k=0;for(let i=3;i<d.length;i+=40)if(!d[i])k++;
    if(k/(d.length/40)>.45){fin=true;c.style.display="none";setTimeout(done,500)}}
}
function coins(p,done){
  let s=0,t=10;
  st.innerHTML=title(T.coins)+`<div class="hud">🪙 <span id="s">0</span> &nbsp; ⏱ <span id="t">10</span></div><div class="arena" id="ar"></div>`;
  const ar=$("#ar"),sp=setInterval(()=>{const b=document.createElement("button");b.className="coin";b.textContent="🪙";
    b.style.left=Math.random()*(ar.clientWidth-50)+"px";
    b.onpointerdown=()=>{s++;$("#s").textContent=s;b.remove()};ar.appendChild(b);setTimeout(()=>b.remove(),2500)},420);
  const tm=setInterval(()=>{$("#t").textContent=--t;if(t<=0){clearInterval(tm);clearInterval(sp);setTimeout(done,300)}},1000);
}
function slot(p,done){
  const S=["🎁","🪙","⭐","🚕","7️⃣"];
  st.innerHTML=title(T.slot)+`<div class="reels"><div class="reel">🎁</div><div class="reel">🪙</div><div class="reel">⭐</div></div><button class="btn" id="b">${T.spin}</button>`;
  const rs=[...st.querySelectorAll(".reel")];
  $("#b").onclick=function(){this.disabled=true;const win=rnd(S);
    rs.forEach((r,i)=>{const iv=setInterval(()=>r.textContent=rnd(S),70);
      setTimeout(()=>{clearInterval(iv);r.textContent=win;if(i==2)setTimeout(done,700)},1000+i*600)})};
}


function drive(p,done){
  st.innerHTML=title(T.drive)+`<p>${T.steer}</p><canvas id="cv" width="300" height="420" style="width:min(300px,100%);height:auto;aspect-ratio:300/420;border-radius:24px;touch-action:none;background:#4a4a4a;box-shadow:0 10px 30px rgba(0,0,0,.25)"></canvas>`;
  const cv=$("#cv"),x=cv.getContext("2d"),CY=340,TOTAL=2600,SP=190,obs=[];
  for(let d=320;d<TOTAL-150;d+=190+Math.random()*60){
    const a=50+Math.random()*200,e=rnd(["🚧","🛢️","🪨","🚧"]);obs.push({d,x:a,e});
    if(Math.random()<.4)obs.push({d,x:a<150?a+110+Math.random()*(170-a):a-110-Math.random()*(a-130),e:rnd(["🚧","🪨"])});
  }
  let cx=150,tx=150,dist=0,slow=0,shake=0,ph=0,pt=0,down=0,last=performance.now();
  const at=e=>{const r=cv.getBoundingClientRect();tx=(e.clientX-r.left)*300/r.width};
  cv.onpointerdown=e=>{down=1;cv.setPointerCapture(e.pointerId);at(e)};cv.onpointermove=e=>down&&at(e);cv.onpointerup=()=>down=0;
  document.addEventListener("keydown",e=>{if(cv.isConnected){if(e.key=="ArrowLeft")tx-=45;if(e.key=="ArrowRight")tx+=45}});
  const rr=(a,b,w,h,r)=>{x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)};
  function car(px,py){x.save();x.translate(px,py);
    x.fillStyle="#111";[[-19,-20],[15,-20],[-19,8],[15,8]].forEach(w=>x.fillRect(w[0],w[1],5,14));
    x.fillStyle="#ffd400";rr(-15,-27,30,54,9);x.fill();
    x.fillStyle="#222";rr(-11,-14,22,12,3);x.fill();rr(-11,9,22,8,3);x.fill();
    x.fillStyle="#e30613";x.beginPath();x.arc(0,3,4,0,7);x.fill();x.restore()}
  function bg(){
    x.fillStyle="#4a4a4a";x.fillRect(0,0,300,420);x.fillStyle="#fff";x.fillRect(6,0,4,420);x.fillRect(290,0,4,420);
    x.fillStyle="#ffd400";const o=dist%40;for(const lx of[100,200])for(let y=-40+o;y<420;y+=40)x.fillRect(lx-2,y,4,20);
    const fy=CY-(TOTAL-dist);
    if(fy>-30&&fy<430)for(let i=0;i<14;i++)for(let j=0;j<2;j++){x.fillStyle=(i+j)%2?"#fff":"#111";x.fillRect(10+i*20,fy+j*12,20,12)}
    x.font="34px serif";x.textAlign="center";x.textBaseline="middle";
    for(const o of obs){const oy=CY-(o.d-dist);if(oy>-40&&oy<460){x.globalAlpha=o.h?.3:1;x.fillText(o.e,o.x,oy)}}x.globalAlpha=1}
  function frame(now){
    if(!cv.isConnected)return;
    const dt=Math.min((now-last)/1000,.05);last=now;
    if(ph<2){
      slow=Math.max(0,slow-dt);shake=Math.max(0,shake-dt);
      dist+=SP*(ph?.5:slow>0?.35:1)*dt;
      cx+=(tx-cx)*Math.min(1,dt*10);cx=Math.max(24,Math.min(276,cx));
      if(!ph){for(const o of obs){if(o.h)continue;const oy=CY-(o.d-dist);
        if(Math.abs(oy-CY)<36&&Math.abs(o.x-cx)<32){o.h=1;slow=.7;shake=.4}}
        if(dist>=TOTAL){ph=1;pt=now}}
      else if(now-pt>800){ph=2;pt=now}
      bg();car(cx+(shake?Math.sin(now/20)*3:0),CY);
    }else{
      const e=(now-pt)/1000;bg();
      x.save();x.translate(150,200);
      if(e<1){x.rotate(Math.sin(e*45)*.18*e);x.scale(1+e*.25,1+e*.25);x.font="100px serif";x.fillText("🎁",0,0)}
      else{x.scale(1.2,1.2);x.font="100px serif";x.fillText("🎉",0,0);x.font="40px serif";x.fillText("✨",-70,-60);x.fillText("✨",72,-50);x.fillText("✨",60,70)}
      x.restore();
      if(e>1.7){done();return}
    }
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame);
}
// ---- background music (synthesized, no audio files)
let ac,mg,on=true;
function music(){
  if(ac){if(ac.state==="suspended"&&on)ac.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  ac=new C();mg=ac.createGain();mg.gain.value=on?.16:0;mg.connect(ac.destination);
  const S=[523.25,587.33,659.25,783.99,880],R=[130.81,98,110,87.31],
  M=[2,-1,3,2,4,3,2,-1, 1,-1,3,1,3,2,1,-1, 2,-1,4,2,4,3,2,-1, 0,-1,2,0,3,2,1,0],
  sec=60/128/2;let step=0,t0=ac.currentTime+.1;
  function nt(f,t,d,ty,v){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
  setInterval(()=>{while(t0<ac.currentTime+.4){
    const i=step%32,bar=i>>3,t=t0;
    if(i%2==0)nt(R[bar],t,sec*1.8,"triangle",.9);
    if(i%4==2)nt(R[bar]*2,t,sec*.8,"triangle",.35);
    if(M[i]>=0)nt(S[M[i]],t,sec*1.6,"square",.12);
    if(i%2==1)nt(3000,t,.03,"square",.04);
    step++;t0+=sec}},100);
}
function mute(){on=!on;$("#mu").textContent=on?"🔊":"🔇";if(mg)mg.gain.setTargetAtTime(on?.16:0,ac.currentTime,.05)}
$("#mu").onclick=()=>{mute();if(on)music()};
document.addEventListener("visibilitychange",()=>{if(!ac)return;document.hidden?ac.suspend():(on&&ac.resume())});
home();
</script></body></html>
